# =====================================================================
# 图像增强实习 · 路线B（轻量 UNet）配置文件
# 下载数据集后，只需修改本文件 data 部分，再依次运行：
#   python scripts/make_filelist.py
#   python src/train.py
#   python src/evaluate.py
# =====================================================================

data:
  # 数据根目录（含 Sony / Canon 两个子集目录）
  root: "data"
  # 当前处理的子集：Sony 或 Canon
  dataset: "Sony"
  # 低光 RAW 与 GT 的子目录名。留空 = 递归扫描整个子集目录，
  # 兼容 Sony/Sony_0.001/0.001 这类多层嵌套结构
  raw_subdir: ""
  gt_subdir: ""
  # 文件扩展名（RAW 支持 raw/arw/cr2/dng/nef；GT 支持 jpg/png/bmp）
  raw_ext: "raw"
  gt_ext: "jpg"
  # 相机参数（Sony 14bit: 黑电平 512、白电平 16383）
  # Canon 的参数可能不同，需下载后确认并在此修改
  black_level: 512
  white_level: 16383
  # .raw 二进制文件的尺寸（仅 raw_ext=raw 时使用；arw/cr2 等由 rawpy 自动读取）
  raw_width: 3840
  raw_height: 2160
  # 验证集比例
  val_ratio: 0.1

model:
  in_channels: 4        # RGGB 四通道打包
  out_channels: 12      # 3 * 2^2，pixel_shuffle 后变为 3 通道全分辨率
  base_channels: 32     # 首层卷积通道数
  num_levels: 4         # 下采样层数
  norm: "instance"      # instance / group / none

train:
  epochs: 50
  batch_size: 8
  patch_size: 512       # 低光 packed RAW 的裁剪尺寸（GT 对应为 2 倍）
  lr: 0.0001
  weight_decay: 0.0
  num_workers: 4
  amp: true             # 混合精度
  grad_clip: 1.0
  warmup_epochs: 2
  seed: 42
  # 损失权重
  l1_weight: 1.0
  ssim_weight: 0.15
  perceptual: false
  perceptual_weight: 0.05
  # 输出目录
  log_dir: "outputs/logs"
  ckpt_dir: "outputs/checkpoints"
  resume: ""            # 断点续训的 checkpoint 路径，空则从头训练

eval:
  metrics: ["psnr", "ssim", "lpips"]
  lpips_net: "alex"
  output_dir: "outputs/results"
  save_images: true     # 是否保存增强后的图片
  num_samples: 4        # 可视化对比图数量
  run_baseline: true    # 是否一并跑传统基线(A)用于对比
  baseline_method: "clahe"   # gamma / clahe / retinex / hist

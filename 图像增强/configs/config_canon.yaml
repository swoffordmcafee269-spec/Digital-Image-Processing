# =====================================================================
# 图像增强实习 · Canon 子集配置（路线 B，与 Sony v1 同参数）
# 相机参数与 Sony 一致：black 512 / white 16383
# =====================================================================

data:
  root: "data"
  dataset: "Canon"
  raw_subdir: ""
  gt_subdir: ""
  raw_ext: "raw"
  gt_ext: "jpg"
  black_level: 512
  white_level: 16383
  raw_width: 3840
  raw_height: 2160
  val_ratio: 0.1

model:
  in_channels: 4
  out_channels: 12
  base_channels: 32
  num_levels: 4
  norm: "instance"

train:
  epochs: 50
  batch_size: 8
  patch_size: 512
  lr: 0.0001
  weight_decay: 0.0
  num_workers: 4
  amp: true
  grad_clip: 1.0
  warmup_epochs: 2
  seed: 42
  l1_weight: 1.0
  ssim_weight: 0.15
  perceptual: false
  perceptual_weight: 0.05
  log_dir: "outputs/logs_canon"
  ckpt_dir: "outputs/checkpoints_canon"
  resume: ""

eval:
  metrics: ["psnr", "ssim", "lpips"]
  lpips_net: "alex"
  output_dir: "outputs/results"
  save_images: true
  num_samples: 4
  run_baseline: true
  baseline_method: "clahe"
